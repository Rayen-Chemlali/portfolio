  <title id="page-title">Rayen Chemlali | Software Engineer & AI Developer – Tunis, Tunisia</title>
  <style>
    :root {
      --bg: #080c14;
      --sidebar-bg: #0d1220;
      --card-bg: #0f1929;
      --border: #1a2740;
      --border-hover: #00d4ff;
      --accent: #00d4ff;
      --accent-dim: rgba(0,212,255,0.08);
      --text: #e2e8f0;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --sidebar-w: 220px;
      --topbar-h: 40px;
      --font-display: 'Syne', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    #topbar {
      height: var(--topbar-h);
      background: #060a10;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 100;
    }
    .topbar-dots { display: flex; gap: 6px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #febc2e; }
    .dot-g { background: #28c840; }
    .topbar-url {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .topbar-url span { color: var(--accent); }
    #lang-toggle {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
    }
    .lang-btn {
      padding: 3px 10px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #000;
    }

    /* ── LAYOUT ── */
    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      padding: 20px 0 20px;
    }
    .sidebar-logo {
      padding: 0 16px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .sidebar-logo-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.3px;
    }
    .sidebar-logo-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent);
      margin-top: 2px;
    }
    .sidebar-section-label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 8px 16px 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      position: relative;
    }
    .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .nav-item.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: var(--accent-dim);
    }
    .nav-icon { font-size: 13px; width: 16px; text-align: center; }

    /* ── MAIN PANEL ── */
    #main-panel {
      flex: 1;
      overflow-y: auto;
      padding: 40px 48px 60px;
      scroll-behavior: smooth;
    }
    #main-panel::-webkit-scrollbar { width: 4px; }
    #main-panel::-webkit-scrollbar-track { background: transparent; }
    #main-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── SECTION STYLES ── */
    .section { display: none; animation: fadeIn 0.3s ease; }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .section-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 6px;
      opacity: 0.7;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 32px;
      line-height: 1.1;
    }

    /* ── PARTICLES ── */
    #particles-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* ── HERO ── */
    #hero-section {
      min-height: calc(100vh - var(--topbar-h) - 100px);
      display: flex;
      align-items: center;
      gap: 48px;
    }
    .hero-left { flex: 1; }
    .hero-greeting {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .hero-name {
      font-family: var(--font-display);
      font-size: clamp(36px, 5vw, 58px);
      font-weight: 800;
      color: var(--text);
      line-height: 1.05;
      margin-bottom: 12px;
    }
    .hero-name span { color: var(--accent); }
    .hero-role {
      font-family: var(--font-mono);
      font-size: 16px;
      color: var(--text-dim);
      margin-bottom: 20px;
      min-height: 24px;
    }
    .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); margin-left: 2px; animation: blink 0.8s step-end infinite; vertical-align: text-bottom; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .hero-bio {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 460px;
      margin-bottom: 28px;
    }
    .hero-btns { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-primary {
      padding: 10px 22px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      letter-spacing: 0.3px;
    }
    .btn-primary:hover { background: #33ddff; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,212,255,0.3); }
    .btn-outline {
      padding: 10px 22px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-outline:hover { background: var(--accent-dim); transform: translateY(-1px); }
    .hero-socials { display: flex; gap: 14px; margin-top: 24px; }
    .social-link {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 15px;
      transition: all 0.2s;
    }
    .social-link:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .hero-right {
      flex: 0 0 320px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.8;
      position: relative;
      overflow: hidden;
    }
    .hero-right::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #8b5cf6, var(--accent));
      background-size: 200%;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer { 0%{background-position:0%} 100%{background-position:200%} }
    .code-file-tab {
      display: flex; align-items: center; gap: 6px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
      color: var(--text-muted);
      font-size: 10px;
    }
    .code-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .json-key { color: #7dd3fc; }
    .json-str { color: #86efac; }
    .json-arr { color: #fbbf24; }
    .json-bool { color: var(--accent); }
    .json-punc { color: var(--text-muted); }

    /* ── ABOUT ── */
    .about-grid { display: grid; grid-template-columns: 1fr 280px; gap: 32px; }
    .about-text { font-size: 14px; color: var(--text-dim); line-height: 1.8; }
    .about-text p { margin-bottom: 16px; }
    .about-stats { display: flex; flex-direction: column; gap: 12px; }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .stat-card-num {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent);
      font-family: var(--font-mono);
    }
    .stat-card-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .lang-bars { margin-top: 12px; }
    .lang-bar-item { margin-bottom: 12px; }
    .lang-bar-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
    .lang-bar-track { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .lang-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 1s ease; width: 0; }

    /* ── SKILLS ── */
    .skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .skill-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: border-color 0.2s;
    }
    .skill-card:hover { border-color: var(--accent); }
    .skill-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .skill-icon { font-size: 20px; }
    .skill-category { font-size: 13px; font-weight: 700; color: var(--text); }
    .skills-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .skill-pill {
      padding: 4px 10px;
      background: rgba(0,212,255,0.06);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 20px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      transition: all 0.15s;
    }
    .skill-pill:hover { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

    /* ── EXPERIENCE ── */
    .timeline { position: relative; padding-left: 30px; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 8px; top: 8px; bottom: 8px;
      width: 2px;
      background: var(--border);
    }
    .timeline-item { position: relative; margin-bottom: 32px; }
    .timeline-dot {
      position: absolute;
      left: -26px; top: 6px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.2);
    }
    .timeline-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: border-color 0.2s;
    }
    .timeline-card:hover { border-color: rgba(0,212,255,0.4); }
    .timeline-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
    .timeline-role { font-size: 15px; font-weight: 700; color: var(--text); }
    .timeline-period {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .timeline-company { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
    .timeline-type-badge {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(100,116,139,0.15);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .timeline-desc { font-size: 13px; color: var(--text-muted); line-height: 1.7; }

    /* ── PROJECTS ── */
    .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .project-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--project-color, var(--accent));
      transform: scaleX(0);
      transition: transform 0.2s;
    }
    .project-card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,212,255,0.08); }
    .project-card:hover::after { transform: scaleX(1); }
    .project-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .project-emoji { font-size: 24px; }
    .project-status {
      font-family: var(--font-mono);
      font-size: 9px;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid;
    }
    .status-done { color: #22c55e; border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.08); }
    .status-dev { color: #f59e0b; border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.08); }
    .status-p1 { color: #38bdf8; border-color: rgba(56,189,248,0.3); background: rgba(56,189,248,0.08); }
    .project-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .project-tagline { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 14px; }
    .project-tech-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
    .tech-chip {
      padding: 2px 7px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
    }
    .project-view-btn {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      transition: gap 0.15s;
    }
    .project-card:hover .project-view-btn { gap: 10px; }

    /* ── MODAL ── */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #modal-overlay.open { display: flex; }
    #modal-box {
      background: #0c1525;
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    #modal-box::-webkit-scrollbar { width: 3px; }
    #modal-box::-webkit-scrollbar-thumb { background: var(--border); }
    .modal-header {
      position: relative;
      padding: 28px 28px 20px;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    .modal-watermark {
      position: absolute;
      right: -10px; top: -10px;
      font-size: 80px;
      font-weight: 800;
      opacity: 0.05;
      line-height: 1;
      font-family: var(--font-display);
      pointer-events: none;
      user-select: none;
    }
    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      width: 28px; height: 28px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      z-index: 2;
    }
    .modal-close:hover { border-color: var(--accent); color: var(--accent); }
    .modal-emoji { font-size: 32px; margin-bottom: 8px; }
    .modal-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .modal-badges { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .modal-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 4px;
      background: rgba(255,255,255,0.05);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .modal-tech-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .modal-body { padding: 20px 28px 28px; }
    .modal-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .modal-tab {
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s;
    }
    .modal-tab:hover { color: var(--text); }
    .modal-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .modal-tab-content { display: none; }
    .modal-tab-content.active { display: block; }
    .modal-overview { font-size: 13px; color: var(--text-dim); line-height: 1.8; }
    .modal-features-list { list-style: none; }
    .modal-features-list li {
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 13px;
      color: var(--text-dim);
      display: flex; align-items: flex-start; gap: 8px;
    }
    .modal-features-list li::before { content: '→'; color: var(--accent); flex-shrink: 0; }
    .modal-text { font-size: 13px; color: var(--text-dim); line-height: 1.8; }
    .modal-my-role {
      background: var(--accent-dim);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 8px;
      padding: 12px 14px;
      margin-top: 16px;
    }
    .modal-my-role-label { font-family: var(--font-mono); font-size: 10px; color: var(--accent); margin-bottom: 4px; }
    .modal-my-role-text { font-size: 12px; color: var(--text-dim); }
    .modal-links { display: flex; gap: 10px; flex-wrap: wrap; padding: 16px 28px 20px; border-top: 1px solid var(--border); }
    .modal-link-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-decoration: none;
      transition: all 0.15s;
    }
    .modal-link-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

    /* ── EDUCATION ── */
    .edu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .edu-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: border-color 0.2s;
      position: relative;
      overflow: hidden;
    }
    .edu-card:hover { border-color: rgba(0,212,255,0.4); }
    .edu-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
    }

function navigate(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  const sec = document.getElementById('section-' + id);
  if (sec) sec.classList.add('active');
  currentSection = id;
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.section === id);
  });
  document.querySelectorAll('.mobile-nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.section === id);
  });
  if (id === 'about') animateLangBars();
}

// ═══════════════════════════════════════════════════════
//  TYPEWRITER
// ═══════════════════════════════════════════════════════
function startTypewriter() {
  const roles = PORTFOLIO_DATA.meta.roles[lang];
  const el = document.getElementById('typewriter');
  if (!el) return;
  if (typewriterTimeout) clearTimeout(typewriterTimeout);
  typewriterIndex = 0; typewriterCharIndex = 0; typewriterDeleting = false;
  function tick() {
    const current = roles[typewriterIndex % roles.length];
    if (typewriterDeleting) {
      typewriterCharIndex--;
      el.textContent = current.substring(0, typewriterCharIndex);
      if (typewriterCharIndex === 0) { typewriterDeleting = false; typewriterIndex++; typewriterTimeout = setTimeout(tick, 400); return; }
      typewriterTimeout = setTimeout(tick, 40);
    } else {
      typewriterCharIndex++;
      el.textContent = current.substring(0, typewriterCharIndex);
      if (typewriterCharIndex === current.length) { typewriterDeleting = true; typewriterTimeout = setTimeout(tick, 1800); return; }
      typewriterTimeout = setTimeout(tick, 80);
    }
  }
  tick();
}

    <span class="modal-badge">👥 ${p.team}</span>

  `;
  document.getElementById('modal-tech-el').innerHTML = p.tech.map(tech => `<span class="tech-chip">${tech}</span>`).join('');
  const tabs = [
    { key: 'overview', label: t(UI_LABELS.tab_overview) },
    { key: 'features', label: t(UI_LABELS.tab_features) },
    { key: 'challenges', label: t(UI_LABELS.tab_challenges) },
    { key: 'learnings', label: t(UI_LABELS.tab_learnings) }
  ];
  document.getElementById('modal-tabs-el').innerHTML = tabs.map((tab, i) => `
    <div class="modal-tab${i===0?' active':''}" role="tab" aria-selected="${i===0}"
         onclick="switchModalTab('${tab.key}', this)" data-tab="${tab.key}">${tab.label}</div>
  `).join('');
  document.getElementById('modal-tab-contents').innerHTML = tabs.map((tab, i) => {
    let content = '';
    if (tab.key === 'overview') {
      content = `<p class="modal-overview">${t(p.tabs.overview)}</p>
        <div class="modal-my-role">
          <div class="modal-my-role-label">${t(UI_LABELS.my_role)}</div>
          <div class="modal-my-role-text">${t(p.myRole)}</div>

    } else if (tab.key === 'learnings') {
      content = `<p class="modal-text">${t(p.tabs.learnings)}</p>`;

  }).join('');

  overlay.classList.add('open');
  overlay.focus();
  document.body.style.overflow = 'hidden';
}

function switchModalTab(key, el) {
  document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.modal-tab-content').forEach(c => {
    c.classList.toggle('active', c.dataset.content === key);
  });
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modal-close-btn').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === document.getElementById('modal-overlay')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ═══════════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════════
function initParticles() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  function makeParticles() {
    particles = Array.from({length: 60}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.5 + 0.3,
      vx: (Math.random() - 0.5) * 0.2,
      vy: (Math.random() - 0.5) * 0.2,
      alpha: Math.random() * 0.4 + 0.1
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,212,255,${p.alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize(); makeParticles(); draw();
  window.addEventListener('resize', () => { resize(); makeParticles(); });
}

function injectSchema() {

    "@context": "https://schema.org",

    "name": d.meta.name,
    "jobTitle": "Software Engineering Student",
    "alumniOf": { "@type": "CollegeOrUniversity", "name": "INSAT – Institut National des Sciences Appliquées et de Technologie" },
    "knowsAbout": ["Software Engineering","Machine Learning","Competitive Programming","Full-Stack Development","Angular","NestJS","Python","Rust","Docker","Kubernetes"],
    "url": "https://rayen-chemlali.dev",
    "email": d.meta.email,
    "telephone": d.meta.phone,
    "address": { "@type": "PostalAddress", "addressLocality": "Tunis", "addressCountry": "TN" },
    "sameAs": [d.meta.linkedin, d.meta.github],
    "hasCredential": d.certifications.map(c => ({
      "@type": "EducationalOccupationalCredential",
      "name": c.name,
      "credentialCategory": "Certificate",
      "recognizedBy": { "@type": "Organization", "name": c.issuer }

  };
  const script = document.createElement('script');
  script.type = 'application/ld+json';
  script.textContent = JSON.stringify(schema);
  document.head.appendChild(script);
}
