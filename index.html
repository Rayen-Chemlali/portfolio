  <style>
    :root {
      --bg: #080c14;
      --sidebar-bg: #0d1220;
      --card-bg: #0f1929;
      --border: #1a2740;
      --border-hover: #00d4ff;

      --text: #e2e8f0;

      --text-dim: #94a3b8;

      --font-display: 'Syne', sans-serif;

      --project-color: var(--accent);
      --a-color: var(--accent);

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display), sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    #topbar {
      height: var(--topbar-h);
      background: #060a10;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 100;
    }
    .topbar-dots { display: flex; gap: 6px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #febc2e; }
    .dot-g { background: #28c840; }
    .topbar-url {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .topbar-url span { color: var(--accent); }
    #lang-toggle {
      display: flex;

      border: none;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #000;
    }

    /* ── LAYOUT ── */

    .social-link {

      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;

      transition: all 0.2s;
    }
    .social-link:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .hero-right {
      flex: 0 0 320px;

      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      font-family: var(--font-mono);
      font-size: 12px;

    .hero-right::before {

    /* ── ABOUT ── */
    .about-grid { display: grid; grid-template-columns: 1fr 280px; gap: 32px; align-items: start; }
    .about-text { font-size: 14px; color: var(--text-dim); line-height: 1.8; }

    .lang-bar-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
    .lang-bar-track { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .lang-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 1s ease; width: 0; }

    .timeline { position: relative; padding-left: 30px; }

      box-shadow: 0 0 0 3px rgba(0,212,255,0.2);

    .timeline-card {

      border-radius: 12px;
      padding: 20px;
      transition: border-color 0.2s;

    .timeline-card:hover { border-color: rgba(0,212,255,0.4); }
    .timeline-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }

      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .timeline-desc { font-size: 13px; color: var(--text-muted); line-height: 1.7; }

    /* ── PHOTO ── */
    .photo-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    .photo-ring {
      position: relative;
      width: 140px;
      height: 140px;
      flex-shrink: 0;
    }
    .photo-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(var(--accent), #8b5cf6, #10b981, var(--accent));
      animation: spin 6s linear infinite;
      z-index: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .photo-ring::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      background: var(--bg);
      z-index: 1;
    }
    .photo-img {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--card-bg);

    .photo-placeholder {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--card-bg);
      border: 3px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: border-color 0.2s;

    .photo-placeholder:hover { border-color: var(--accent); }
    .photo-placeholder-icon { font-size: 32px; opacity: 0.4; }
    .photo-placeholder-text {

    .modal-watermark {
      position: absolute;
      right: -10px; top: -10px;
      font-size: 80px;
      font-weight: 800;
      opacity: 0.05;
      line-height: 1;
      font-family: var(--font-display);
      pointer-events: none;
      user-select: none;
    }
    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      width: 28px; height: 28px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      z-index: 2;
    }
    .modal-close:hover { border-color: var(--accent); color: var(--accent); }
    .modal-emoji { font-size: 32px; margin-bottom: 8px; }
    .modal-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .modal-badges { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .modal-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 4px;
      background: rgba(255,255,255,0.05);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .modal-tech-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .modal-body { padding: 20px 28px 28px; }
    .modal-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .modal-tab {
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s;
    }
    .modal-tab:hover { color: var(--text); }
    .modal-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .modal-tab-content { display: none; }
    .modal-tab-content.active { display: block; }
    .modal-overview { font-size: 13px; color: var(--text-dim); line-height: 1.8; }
    .modal-features-list { list-style: none; }
    .modal-features-list li {
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 13px;
      color: var(--text-dim);
      display: flex; align-items: flex-start; gap: 8px;
    }
    .modal-features-list li::before { content: '→'; color: var(--accent); flex-shrink: 0; }
    .modal-text { font-size: 13px; color: var(--text-dim); line-height: 1.8; }
    .modal-my-role {
      background: var(--accent-dim);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 8px;
      padding: 12px 14px;
      margin-top: 16px;
    }
    .modal-my-role-label { font-family: var(--font-mono); font-size: 10px; color: var(--accent); margin-bottom: 4px; }
    .modal-my-role-text { font-size: 12px; color: var(--text-dim); }
    .modal-links { display: flex; gap: 10px; flex-wrap: wrap; padding: 16px 28px 20px; border-top: 1px solid var(--border); }
    .modal-link-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-decoration: none;
      transition: all 0.15s;
    }
    .modal-link-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

    /* ── EDUCATION ── */
    .edu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .edu-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: border-color 0.2s;
      position: relative;
      overflow: hidden;
    }
    .edu-card:hover { border-color: rgba(0,212,255,0.4); }
    .edu-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
    }
    .edu-inst { font-size: 18px; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
    .edu-full { font-size: 11px; color: var(--text-muted); margin-bottom: 12px; font-family: var(--font-mono); }
    .edu-degree { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .edu-period { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-bottom: 14px; }
    .edu-highlights { list-style: none; }
    .edu-highlights li {
      font-size: 12px;
      color: var(--text-muted);
      padding: 4px 0;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .edu-highlights li::before { content: '▸'; color: var(--accent); flex-shrink: 0; }

    /* ── ACHIEVEMENTS ── */
    .achievements-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .achievement-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .achievement-card:hover { transform: translateY(-3px); border-color: var(--a-color, var(--accent)); box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    .achievement-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at top, var(--a-color-dim, rgba(0,212,255,0.05)), transparent 70%);
      pointer-events: none;
    }
    .achievement-medal { font-size: 40px; margin-bottom: 10px; display: block; transition: transform 0.2s; position: relative; z-index: 1; }
    .achievement-card:hover .achievement-medal { transform: scale(1.1) rotate(-5deg); }
    .achievement-place {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid;
      display: inline-block;
      margin-bottom: 12px;
      position: relative; z-index: 1;
    }
    .achievement-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 6px; position: relative; z-index: 1; }
    .achievement-subtitle { font-size: 11px; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px; position: relative; z-index: 1; }
    .achievement-link {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      transition: all 0.15s;
      background: transparent;
      cursor: pointer;
      font-family: var(--font-display);
      position: relative; z-index: 2;
    }
    .achievement-link:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

    /* ── CERTIFICATIONS ── */
    .certs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .cert-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
    }
    .cert-card:hover { border-color: var(--accent); box-shadow: 0 0 20px rgba(0,212,255,0.08); transform: translateY(-2px); }
    .cert-icon { font-size: 26px; margin-bottom: 10px; }
    .cert-name { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; line-height: 1.4; }
    .cert-issuer { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-bottom: 14px; flex: 1; }
    .cert-link {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      padding: 5px 10px;
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 5px;
      transition: all 0.15s;
      align-self: flex-start;
    }
    .cert-link:hover { background: var(--accent-dim); }

    /* ── CONTACT ── */
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .contact-info { display: flex; flex-direction: column; gap: 12px; }
    .contact-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      transition: all 0.15s;
    }
    .contact-card:hover { border-color: var(--accent); background: var(--accent-dim); }
    .contact-card-icon { font-size: 18px; }
    .contact-card-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); }
    .contact-card-val { font-size: 13px; color: var(--text); font-weight: 600; }
    .contact-form { display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.5px; }
    .form-input, .form-textarea {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 12px;
      color: var(--text);
      font-family: var(--font-display);
      font-size: 13px;
      transition: border-color 0.15s;
      outline: none;
      resize: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
    .form-textarea { height: 100px; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 16px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    footer span { color: var(--accent); }

    /* ── MOBILE ── */
    #mobile-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #060a10;
      border-top: 1px solid var(--border);
      z-index: 200;
      padding: 8px 0 12px;
      overflow-x: auto;
    }
    .mobile-nav-inner { display: flex; justify-content: space-around; min-width: 100%; padding: 0 8px; }
    .mobile-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 10px;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.15s;
      font-size: 9px;
      font-family: var(--font-mono);
      white-space: nowrap;
    }
    .mobile-nav-item .nav-icon { font-size: 16px; }
    .mobile-nav-item.active { color: var(--accent); }

    @media (max-width: 900px) {
      #sidebar { display: none; }
      #mobile-nav { display: block; }
      #main-panel { padding: 24px 20px 80px; overflow-y: auto; }
      body { overflow: auto; }
      #layout { overflow: visible; }
      .projects-grid { grid-template-columns: repeat(2, 1fr); }
      .about-grid { grid-template-columns: 1fr; }
      .edu-grid { grid-template-columns: 1fr; }
      .achievements-grid { grid-template-columns: 1fr; }
      .certs-grid { grid-template-columns: repeat(2, 1fr); }
      .contact-grid { grid-template-columns: 1fr; }
      .skills-grid { grid-template-columns: 1fr; }
      #hero-section { flex-direction: column; gap: 28px; }
      .hero-right { flex: none; width: 100%; }
    }
    @media (max-width: 560px) {
      .projects-grid { grid-template-columns: 1fr; }
      .certs-grid { grid-template-columns: 1fr; }
      .topbar-url { display: none; }
    }
  </style>
</head>

  function navigate(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    const sec = document.getElementById('section-' + id);
    if (sec) sec.classList.add('active');
    currentSection = id;
    document.querySelectorAll('.nav-item').forEach(n => {
      n.classList.toggle('active', n.dataset.section === id);
    });
    document.querySelectorAll('.mobile-nav-item').forEach(n => {
      n.classList.toggle('active', n.dataset.section === id);
    });
    if (id === 'about') animateLangBars();
  }

  // ═══════════════════════════════════════════════════════
  //  TYPEWRITER
  // ═══════════════════════════════════════════════════════
  function startTypewriter() {
    const roles = PORTFOLIO_DATA.meta.roles[lang];
    const el = document.getElementById('typewriter');
    if (!el) return;
    if (typewriterTimeout) clearTimeout(typewriterTimeout);
    typewriterIndex = 0; typewriterCharIndex = 0; typewriterDeleting = false;
    function tick() {
      const current = roles[typewriterIndex % roles.length];
      if (typewriterDeleting) {
        typewriterCharIndex--;
        el.textContent = current.substring(0, typewriterCharIndex);
        if (typewriterCharIndex === 0) { typewriterDeleting = false; typewriterIndex++; typewriterTimeout = setTimeout(tick, 400); return; }
        typewriterTimeout = setTimeout(tick, 40);
      } else {
        typewriterCharIndex++;
        el.textContent = current.substring(0, typewriterCharIndex);
        if (typewriterCharIndex === current.length) { typewriterDeleting = true; typewriterTimeout = setTimeout(tick, 1800); return; }
        typewriterTimeout = setTimeout(tick, 80);
      }
    }
    tick();
  }

  function renderProjects() {
    document.getElementById('label-projects').textContent = t(UI_LABELS.proj_lbl);
    document.getElementById('proj-title').textContent = t(UI_LABELS.proj_title);

    const CATS = [
      { key: 'internship', icon: '🏢', label: UI_LABELS.cat_internship },
      { key: 'freelance',  icon: '💼', label: UI_LABELS.cat_freelance },
      { key: 'academic',   icon: '🎓', label: UI_LABELS.cat_academic }
    ];

    // Sort projects within each category by date descending (most recent first)
    const allProjects = [...PORTFOLIO_DATA.projects].sort((a, b) => {
      const getYear = d => parseInt((d || '').match(/\d{4}/)?.[0] || 0);
      return getYear(b.date) - getYear(a.date);
    });

    const container = document.getElementById('projects-container');
    container.innerHTML = CATS.map(cat => {
      const catProjects = allProjects.filter(p => p.category === cat.key);
      if (!catProjects.length) return '';
      return `
      <div class="proj-category">
        <div class="proj-category-header">
          <span class="proj-category-icon" aria-hidden="true">${cat.icon}</span>
          <span class="proj-category-label">${t(cat.label)}</span>
          <span class="proj-category-count">${catProjects.length}</span>

                     onclick="openModal(${idx})"
                     role="button" tabindex="0"

  async function handleFormSubmit() {
    const name = document.getElementById('f-name')?.value?.trim();
    const email = document.getElementById('f-email')?.value?.trim();
    const subject = document.getElementById('f-subject')?.value?.trim();
    const message = document.getElementById('f-message')?.value?.trim();
    if (!name || !email || !message) {
      alert(lang === 'en' ? 'Please fill in Name, Email and Message.' : 'Veuillez remplir Nom, Email et Message.');
      return;
    }
    const btn = document.getElementById('form-submit-btn');
    btn.textContent = lang === 'en' ? 'Sending...' : 'Envoi...';
    btn.disabled = true;

    const FORMSPREE_ID = 'mkoqbpyn';

    if (FORMSPREE_ID === 'YOUR_FORM_ID') {
      // Fallback: open mailto if Formspree not configured yet
      window.location.href = `mailto:${PORTFOLIO_DATA.meta.email}?subject=${encodeURIComponent(subject||'Portfolio Contact')}&body=${encodeURIComponent('From: '+name+' ('+email+')\n\n'+message)}`;
      btn.textContent = t(UI_LABELS.form_send);
      btn.disabled = false;
      return;
    }

    try {
      const res = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ name, email, subject: subject||'Portfolio Contact', message })
      });
      if (res.ok) {
        document.getElementById('form-fields').style.display = 'none';
        document.getElementById('form-success').style.display = 'block';
      } else {
        throw new Error('Failed');
      }
    } catch {
      alert(lang === 'en' ? 'Error sending. Please email directly: ' + PORTFOLIO_DATA.meta.email : 'Erreur d\'envoi. Contactez directement : ' + PORTFOLIO_DATA.meta.email);
      btn.textContent = t(UI_LABELS.form_send);
      btn.disabled = false;
    }
  }

  // ═══════════════════════════════════════════════════════
  //  PARTICLES
  // ═══════════════════════════════════════════════════════
  function initParticles() {
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, particles;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    function makeParticles() {
      particles = Array.from({length: 60}, () => ({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        vx: (Math.random() - 0.5) * 0.2,
        vy: (Math.random() - 0.5) * 0.2,
        alpha: Math.random() * 0.4 + 0.1
      }));
    }
    function draw() {
      ctx.clearRect(0, 0, W, H);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0,212,255,${p.alpha})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    resize(); makeParticles(); draw();
    window.addEventListener('resize', () => { resize(); makeParticles(); });
  }

  // ═══════════════════════════════════════════════════════
  function injectSchema() {
    const d = PORTFOLIO_DATA;
    const schema = {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": d.meta.name,
      "jobTitle": "Software Engineering Student",
      "alumniOf": { "@type": "CollegeOrUniversity", "name": "INSAT – Institut National des Sciences Appliquées et de Technologie" },
      "knowsAbout": ["Software Engineering","Machine Learning","Competitive Programming","Full-Stack Development","Angular","NestJS","Python","Rust","Docker","Kubernetes"],
      "url": "https://rayen-chemlali.vercel.app",
      "email": d.meta.email,
      "telephone": d.meta.phone,
      "address": { "@type": "PostalAddress", "addressLocality": "Tunis", "addressCountry": "TN" },
      "sameAs": [d.meta.linkedin, d.meta.github],
      "hasCredential": d.certifications.map(c => ({
        "@type": "EducationalOccupationalCredential",
        "name": c.name,
        "credentialCategory": "Certificate",
        "recognizedBy": { "@type": "Organization", "name": c.issuer }
      }))
    };
    const script = document.createElement('script');
    script.type = 'application/ld+json';
    script.textContent = JSON.stringify(schema);
    document.head.appendChild(script);
  }

      const reader = new FileReader();
      reader.onload = (ev) => {
        const placeholder = document.getElementById('photo-placeholder');
        if (!placeholder) return;
        placeholder.outerHTML = `<img src="${ev.target.result}" alt="Profile photo" class="hero-photo-img" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
      };
      reader.readAsDataURL(file);
    });
